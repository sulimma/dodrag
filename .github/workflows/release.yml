name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (MAJOR.MINOR.PATCH)
        required: true
        type: string
      publish:
        description: Build, tag, and publish this release (leave unchecked for no-op)
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  windows:
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, x86, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test Windows amd64
        if: matrix.architecture == 'amd64'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: ./build.ps1 -Version $env:VERSION -Architecture '${{ matrix.architecture }}' -Test
      - name: Build Windows secondary architectures
        if: matrix.architecture != 'amd64'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: ./build.ps1 -Version $env:VERSION -Architecture '${{ matrix.architecture }}'
      - name: Stage release executable
        shell: pwsh
        run: Copy-Item "build/bin/dodrag.exe" "build/bin/dodrag-windows-${{ matrix.architecture }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: dodrag-windows-${{ matrix.architecture }}
          path: build/bin/dodrag-windows-${{ matrix.architecture }}.exe
          if-no-files-found: error

  linux:
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-24.04
    container: ubuntu:25.10
    steps:
      - name: Install Wails Linux build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev dpkg-dev ca-certificates git
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and package Ubuntu Questing x86-64
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/package-linux.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: dodrag-linux-amd64-deb
          path: build/bin/dodrag_*.deb
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && inputs.publish
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate release version and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Release tag v$VERSION already exists locally" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "Release tag v$VERSION already exists on origin" >&2
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create and push release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a "$tag" "$GITHUB_SHA" -m "DoDrag $tag"
          git push origin "refs/tags/$tag"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "DoDrag v$VERSION" --generate-notes
