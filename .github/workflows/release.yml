name: Build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: App version (X.Y.Z or X.Y.Zrc); builds Actions artifacts only
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.version.outputs.app }}
      deb: ${{ steps.version.outputs.deb }}
    steps:
      - id: version
        name: Validate build version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          semver='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          if [[ $EVENT == push ]]; then
            [[ $REF_NAME =~ ^v$semver$ ]] || { echo 'Expected a vX.Y.Z tag'; exit 1; }
            version=${REF_NAME#v}
          else
            [[ $INPUT_VERSION =~ ^$semver(rc)?$ ]] || { echo 'Expected X.Y.Z or X.Y.Zrc'; exit 1; }
            version=$INPUT_VERSION
          fi
          deb=${version%rc}
          [[ $version != *rc ]] || deb+=~rc
          deb+=-1
          printf 'app=%s\ndeb=%s\n' "$version" "$deb" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    container:
      # Ubuntu 25.10 (Questing), not the host runner's ABI.
      image: ubuntu:25.10@sha256:7cc5e35f6567ee8c66d2abb4aab0fd866669e6207c237c3a8f0947a5c7f17092
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Questing build dependencies
        run: |
          # APT still verifies Ubuntu signatures for the EOL archive; only timestamp expiry is waived there.
          sources=/etc/apt/sources.list.d/ubuntu.sources
          key=/usr/share/keyrings/ubuntu-archive-keyring.gpg
          write_source() {
            printf 'Types: deb\nURIs: %s\nSuites: %s\nComponents: main universe\nSigned-By: %s\n%s\n' \
              "$1" "$2" "$key" "${3:-}"
          }
          update() { apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=2 update; }
          # Bootstrap through signed APT metadata without assuming a CA store in the minimal image.
          write_source http://old-releases.ubuntu.com/ubuntu 'questing questing-updates questing-security' 'Check-Valid-Until: no' \
            > "$sources"
          if ! update; then
            write_source http://archive.ubuntu.com/ubuntu 'questing questing-updates' > "$sources"
            write_source http://security.ubuntu.com/ubuntu 'questing-security' >> "$sources"
            update
          fi
          apt-get install -y --no-install-recommends \
            ca-certificates git gcc libc6-dev pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            dpkg-dev binutils desktop-file-utils
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.23.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build and test Questing amd64
        env:
          VERSION: ${{ needs.version.outputs.app }}
        run: bash ./build-linux.sh "$VERSION" --test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dodrag-linux-questing-amd64
          path: build/bin/dodrag_${{ needs.version.outputs.deb }}_amd64.deb
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: version
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, '386']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.23.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build and verify Windows executable
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.app }}
          ARCH: ${{ matrix.arch }}
        run: |
          ./build.ps1 -Version $env:VERSION -Architecture $env:ARCH -Test
          $output = "build/bin/dodrag-windows-$env:ARCH.exe"
          if ($env:ARCH -eq 'amd64') {
            Copy-Item -LiteralPath build/bin/dodrag.exe -Destination $output
          }
          $metadata = go version -m $output
          if ($LASTEXITCODE -ne 0 -or -not ($metadata -match "^\s*build\s+GOARCH=$env:ARCH$")) {
            throw "Wrong or missing target architecture in $output"
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dodrag-windows-${{ matrix.arch }}
          path: build/bin/dodrag-windows-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, linux, windows]
    if: github.event_name == 'push' && github.ref_type == 'tag' && vars.DODRAG_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    # Configure required reviewers and restrict to release tags in repository settings.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Require explicit protected-environment configuration
        env:
          RELEASE_GATE: ${{ secrets.DODRAG_RELEASE_GATE }}
        run: test "$RELEASE_GATE" = enabled
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dodrag-*
          merge-multiple: true
          path: release-assets
      - name: Publish all packages on the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DEB_VERSION: ${{ needs.version.outputs.deb }}
        run: |
          assets=(
            release-assets/dodrag-windows-amd64.exe
            release-assets/dodrag-windows-386.exe
            "release-assets/dodrag_${DEB_VERSION}_amd64.deb"
          )
          for asset in "${assets[@]}"; do test -s "$asset"; done
          gh release create "$TAG" "${assets[@]}" --verify-tag --title "DoDrag $TAG" --generate-notes
